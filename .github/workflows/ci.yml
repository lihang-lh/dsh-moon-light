name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: bundle 语法检查
        run: |
          node --check client.js
          node --check index.js
      - name: 逻辑测试（状态映射 / 配置合并 / 持久化）
        run: node scripts/test.cjs
